# Source configuration. Public metadata only — no prices, no Ideal pricing data.

# Ideal's own bidder identity (public record: Sunbiz + DBPR), so its bids are flagged is_ideal.
[ideal_bidder]
canonical_name = "Ideal Remodeling LLC"
aliases = ["Ideal Construction", "Ideal Remodeling LLC dba Ideal Construction", "Ideal Remodeling"]
fl_license_no = "CGC1537480"
hq_city = "Tampa"
hq_county = "Hillsborough"

# BLS Producer Price Index series used to escalate historical bids to today's dollars.
# applies_to lists project_type codes or work classes; first match wins, "*" is the fallback.
# Series IDs are confirmed on the first `refresh-index`; an ID BLS does not return is a hard error.
[[cost_index_series]]
series_id = "PCU236222236222"
title = "PPI: New school building construction"
applies_to = ["school_district"]

[[cost_index_series]]
series_id = "PCU236220236220"
title = "PPI: Commercial and institutional building construction"
applies_to = ["vertical"]

[[cost_index_series]]
series_id = "PCU562910562910"
title = "PPI: Remediation services"
applies_to = ["restoration"]

[[cost_index_series]]
series_id = "WPUIP2300001"
title = "PPI: Inputs to construction industries, goods"
applies_to = ["*"]

[bls]
endpoint_v1 = "https://api.bls.gov/publicAPI/v1/timeseries/data/"
endpoint_v2 = "https://api.bls.gov/publicAPI/v2/timeseries/data/"
# v2 needs a free key in BLS_API_KEY; v1 works without one (fewer queries per day).

