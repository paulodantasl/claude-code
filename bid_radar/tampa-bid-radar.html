<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tampa Bid Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS — light is the base set; dark redefines tokens only.
   Neutrals are biased green to sit with the ink (#17231F).
   ============================================================ */
:root{
  --paper:#FBFAF7;
  --panel:#FFFFFF;
  --panel-2:#F4F2EC;
  --ink:#17231F;
  --ink-2:#5A6560;
  --ink-3:#8A938E;
  --rule:#D9D7CF;
  --rule-2:#EDEBE4;
  --go:#0F6B5C;
  --go-soft:#DCEAE5;
  --hold:#8A5A00;
  --hold-soft:#F3E7CE;
  --hot:#A31F34;
  --hot-soft:#F6DEE2;
  --off:#9A9A93;
  --off-soft:#EFEFEA;
  --shadow:none;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121614;
    --panel:#191F1C;
    --panel-2:#212926;
    --ink:#E9EEEB;
    --ink-2:#9BA8A2;
    --ink-3:#71807A;
    --rule:#2B3531;
    --rule-2:#222B28;
    --go:#4FB39B;
    --go-soft:#17322C;
    --hold:#D7A64F;
    --hold-soft:#332813;
    --hot:#E97187;
    --hot-soft:#361A20;
    --off:#7C857F;
    --off-soft:#222926;
  }
}
:root[data-theme="dark"]{
  --paper:#121614;
  --panel:#191F1C;
  --panel-2:#212926;
  --ink:#E9EEEB;
  --ink-2:#9BA8A2;
  --ink-3:#71807A;
  --rule:#2B3531;
  --rule-2:#222B28;
  --go:#4FB39B;
  --go-soft:#17322C;
  --hold:#D7A64F;
  --hold-soft:#332813;
  --hot:#E97187;
  --hot-soft:#361A20;
  --off:#7C857F;
  --off-soft:#222926;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Archivo','Helvetica Neue',Arial,sans-serif;
  font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 80px;padding-left:18px;padding-right:18px}
a{color:var(--go)}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-0.02em;line-height:1.08;text-wrap:balance}
h1{font-size:clamp(30px,6.5vw,52px)}
h2{font-size:clamp(20px,3.4vw,27px);margin-bottom:6px}
h3{font-size:17px;font-weight:600;letter-spacing:-0.01em}
p{margin:0 0 12px}
.sub{color:var(--ink-2);font-size:15px;max-width:66ch}
.small{font-size:13px;color:var(--ink-2)}
.mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace}

/* header */
header{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;
  border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:18px;flex-wrap:wrap}
.brand{font-weight:600;font-size:13px;color:var(--ink-2);margin-bottom:10px}
.hcontrols{display:flex;gap:8px;align-items:center;flex:none}
.lang{display:inline-flex;border:1.5px solid var(--ink);border-radius:2px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;font:inherit;font-size:12px;font-weight:600;
  padding:6px 10px;cursor:pointer;color:var(--ink)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* provenance strip */
.vintage{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:22px;font-size:12px}
.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);
  background:var(--panel);padding:4px 9px;border-radius:2px;color:var(--ink-2)}
.tag b{color:var(--ink);font-weight:600}
.tag.warn{background:var(--hold-soft);border-color:var(--hold);color:var(--hold)}
.tag.warn b{color:var(--hold)}

section{margin:38px 0 0}
.sec-head{border-top:1px solid var(--rule);padding-top:16px;margin-bottom:16px}
.sec-head .eyebrow{font-size:11px;font-weight:600;letter-spacing:.10em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:7px;font-family:'IBM Plex Mono',ui-monospace,monospace}

/* ---------- PIPELINE BOARD ---------- */
.pipe-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.pipe-stats{display:flex;flex-wrap:wrap;gap:18px;font-size:13px;color:var(--ink-2)}
.pipe-stats b{color:var(--ink);font-weight:700;font-size:15px}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:12px;align-items:start}
.col{background:var(--panel-2);border:1px solid var(--rule-2);padding:10px;min-width:0}
.col-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  padding-bottom:8px;margin-bottom:9px;border-bottom:1px solid var(--rule)}
.col-head .nm{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.col-head .ct{font-size:12px;color:var(--ink-2);font-family:'IBM Plex Mono',monospace}
.col[data-tone="off"] .col-head .nm{color:var(--ink-3)}
.col[data-tone="hold"] .col-head .nm{color:var(--hold)}
.col[data-tone="go"] .col-head .nm{color:var(--go)}
.col[data-tone="won"] .col-head .nm{color:var(--go)}
.col[data-tone="hot"] .col-head .nm{color:var(--hot)}
.opp{background:var(--panel);border:1px solid var(--rule);border-left:3px solid var(--rule);
  padding:9px 10px;margin-bottom:8px;font-size:13px}
.opp:last-child{margin-bottom:0}
.opp[data-tone="off"]{border-left-color:var(--off)}
.opp[data-tone="hold"]{border-left-color:var(--hold)}
.opp[data-tone="go"]{border-left-color:var(--go)}
.opp[data-tone="won"]{border-left-color:var(--go);background:var(--go-soft)}
.opp[data-tone="hot"]{border-left-color:var(--hot)}
.opp.rel{border-left-style:dashed;border-left-color:var(--ink-3)}
.opp .nm{font-weight:600;line-height:1.25;margin-bottom:3px}
.opp .loc{font-size:11.5px;color:var(--ink-2);margin-bottom:6px}
.opp .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:11.5px;color:var(--ink-2)}
.opp .row b{color:var(--ink);font-weight:700}
.opp .act{margin-top:7px;padding-top:7px;border-top:1px dotted var(--rule);font-size:11.5px;color:var(--ink-2)}
.opp .act b{color:var(--ink);font-weight:600}
.opp select,.opp input{font:inherit;font-size:11.5px;padding:2px 4px;border:1px solid var(--rule);
  background:var(--panel);color:var(--ink);border-radius:2px;max-width:100%}
.opp .tools{display:flex;gap:6px;margin-top:7px;align-items:center;flex-wrap:wrap}
.xbtn{border:1px solid var(--rule);background:transparent;color:var(--ink-2);font:inherit;
  font-size:11px;padding:2px 7px;cursor:pointer;border-radius:2px}
.xbtn:hover{border-color:var(--hot);color:var(--hot)}
.ex-chip{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--hold);background:var(--hold-soft);border:1px solid var(--hold);padding:1px 5px;border-radius:2px}
.empty{font-size:12px;color:var(--ink-3);padding:6px 2px;font-style:italic}

/* add form */
.addform{background:var(--panel);border:1px solid var(--ink);padding:14px;margin-bottom:14px}
.addgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.addgrid label{display:block;font-size:11px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-2);margin-bottom:3px}
.addgrid input,.addgrid select{width:100%;font:inherit;font-size:13px;padding:6px 8px;
  border:1px solid var(--rule);background:var(--panel);color:var(--ink);border-radius:2px}

/* ---------- DIALS + CALIBRATION ---------- */
.calwrap{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:860px){.calwrap{grid-template-columns:1.55fr 1fr}}
.dials{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:16px;
  background:var(--panel);border:1px solid var(--rule);padding:16px}
.dial label{display:block;font-size:13px;font-weight:600;margin-bottom:2px}
.dial .hint{font-size:12px;color:var(--ink-2);margin-bottom:8px;min-height:44px}
.dial input[type=range]{width:100%;accent-color:var(--go)}
.dial output{font-weight:800;font-size:19px;font-family:'IBM Plex Mono',monospace}
.calib{background:var(--panel);border:1px solid var(--rule);padding:16px;display:flex;flex-direction:column;gap:12px}
.calrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  padding-bottom:9px;border-bottom:1px solid var(--rule-2)}
.calrow:last-of-type{border-bottom:0;padding-bottom:0}
.calrow .k{font-size:12.5px;color:var(--ink-2)}
.calrow .v{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:500;text-align:right}
.calrow .v .m{color:var(--ink-3)}
.calrow .v .a{color:var(--go);font-weight:500}
.calrow .v .none{color:var(--ink-3);font-style:italic;font-family:'Archivo',sans-serif;font-size:12.5px}

/* ---------- CHART ---------- */
.chart{background:var(--panel);border:1px solid var(--rule);padding:18px 16px 12px}
.bars{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px;height:250px;margin-top:8px}
.barcol{display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:0}
.barval{font-size:12px;font-weight:700;text-align:center;margin-bottom:4px;
  font-family:'IBM Plex Mono',monospace}
.barstack{flex:1;min-height:0;display:flex;flex-direction:column-reverse;justify-content:flex-start}
.seg{width:100%;min-height:0}
.barlabel{font-size:12px;text-align:center;padding-top:6px;border-top:1px solid var(--rule);
  color:var(--ink-2);font-family:'IBM Plex Mono',monospace}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;display:inline-block;border-radius:1px;flex:none}

/* ---------- TABLES ---------- */
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;font-size:12px;color:var(--ink-2);
  border-bottom:1px solid var(--ink);padding:0 8px 7px 0;white-space:nowrap}
th[data-sort]{cursor:pointer;user-select:none}
th[data-sort]:hover{color:var(--ink)}
th .ind{color:var(--go);font-weight:800}
td{padding:11px 8px 11px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.num{text-align:right;padding-right:0}
.score{display:inline-block;min-width:38px;text-align:center;font-weight:800;
  padding:3px 6px;border-radius:2px;font-size:13px;font-family:'IBM Plex Mono',monospace}
.s-hi{background:var(--go);color:var(--panel)}
.s-mid{background:var(--hold-soft);color:var(--hold)}
.s-lo{background:var(--off-soft);color:var(--off)}
.meter{height:6px;background:var(--off-soft);margin-top:6px;max-width:180px}
.meter i{display:block;height:100%;background:var(--go)}
.beyond{color:var(--ink-3);font-size:11.5px;display:block}

/* ---------- SIGNALS ---------- */
.sigtable td{vertical-align:middle}
.lead{display:flex;align-items:center;gap:8px;min-width:150px}
.leadbar{height:8px;background:var(--go-soft);border-left:2px solid var(--go);flex:none}
.leadtxt{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-2);white-space:nowrap}
.wired{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  padding:2px 6px;border-radius:2px;white-space:nowrap}
.w-live{background:var(--go-soft);color:var(--go);border:1px solid var(--go)}
.w-part{background:var(--hold-soft);color:var(--hold);border:1px solid var(--hold)}
.w-none{background:var(--off-soft);color:var(--off);border:1px solid var(--off)}
.endpoint{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-2);
  word-break:break-all;display:block;margin-top:3px}

/* ---------- PROJECTS ---------- */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{border:1px solid var(--rule);background:var(--panel);font:inherit;font-size:12.5px;
  font-weight:500;padding:6px 11px;cursor:pointer;border-radius:2px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.proj{background:var(--panel);border:1px solid var(--rule);border-left:4px solid var(--rule);
  padding:14px 16px;margin-bottom:10px}
.proj.f5,.proj.f4{border-left-color:var(--go)}
.proj.f3{border-left-color:var(--hold)}
.proj.f2,.proj.f1{border-left-color:var(--off)}
.proj-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.proj-meta{font-size:12.5px;color:var(--ink-2);margin:3px 0 9px}
.angle{font-size:14px;margin-bottom:10px;max-width:78ch}
.facts{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--ink-2)}
.facts b{color:var(--ink);font-weight:700}
.window{margin-top:11px;height:22px;position:relative;background:var(--off-soft)}
.window i{position:absolute;top:0;bottom:0;background:var(--go-soft);border-left:2px solid var(--go)}
.window u{position:absolute;top:0;bottom:0;width:1px;background:var(--ink);opacity:.45;text-decoration:none}
.window em{position:absolute;font-style:normal;font-size:11px;color:var(--go);font-weight:700;
  top:3px;padding-left:5px;white-space:nowrap}
.wscale{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-2);margin-top:3px;
  font-family:'IBM Plex Mono',monospace}

/* ---------- SIGNAL TRAY ---------- */
.tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:10px}
.sig{background:var(--panel);border:1px solid var(--rule);border-left:3px solid var(--go);
  padding:11px 12px;font-size:13px;display:flex;flex-direction:column;gap:6px;min-width:0}
.sig.low{border-left-color:var(--off)}
.sig.mid{border-left-color:var(--hold)}
.sig-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.sig .nm{font-weight:600;line-height:1.25;min-width:0;overflow-wrap:anywhere}
.sig .addr{font-size:11.5px;color:var(--ink-2);overflow-wrap:anywhere}
.sig .meta{display:flex;flex-wrap:wrap;gap:6px;font-size:11px;color:var(--ink-2)}
.sig .meta span{border:1px solid var(--rule-2);background:var(--panel-2);padding:1px 6px;border-radius:2px}
.sig .contact{font-family:'IBM Plex Mono',monospace;font-size:11.5px;overflow-wrap:anywhere}
.sig .contact a{text-decoration:none}
.sig .flags{font-size:10.5px;color:var(--ink-3);font-style:italic}
.sig .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px;
  border-top:1px dotted var(--rule)}
.sbtn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);font:inherit;
  font-size:11.5px;font-weight:600;padding:4px 10px;cursor:pointer;border-radius:2px}
.sbtn.ghost{background:transparent;color:var(--ink-2);border-color:var(--rule)}
.sbtn.ghost:hover{border-color:var(--hot);color:var(--hot)}
.sbtn:disabled{opacity:.45;cursor:not-allowed}
.traybar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  margin-bottom:12px}
.trayfilters{display:flex;gap:6px;flex-wrap:wrap}
.jt{font-size:11px;padding:2px 6px;border-radius:2px;border:1px solid var(--go);
  color:var(--go);background:var(--go-soft)}
.jt.err{border-color:var(--hot);color:var(--hot);background:var(--hot-soft)}

.note{background:var(--hold-soft);border-left:3px solid var(--hold);padding:12px 14px;font-size:13.5px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);font:inherit;
  font-size:13px;font-weight:600;padding:9px 14px;cursor:pointer;border-radius:2px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:2px solid var(--go);outline-offset:2px}

@media (max-width:640px){
  .hide-s{display:none}
  td,th{font-size:13px}
  .bars{height:200px}
}
@media (prefers-reduced-motion:no-preference){
  .seg{transition:height .25s ease}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div>
    <div class="brand" data-t="brand"></div>
    <h1 data-t="title"></h1>
  </div>
  <div class="hcontrols">
    <div class="lang" role="group" aria-label="Language">
      <button id="en" aria-pressed="true">EN</button>
      <button id="pt" aria-pressed="false">PT-BR</button>
    </div>
  </div>
</header>

<div class="vintage" id="vintage"></div>

<p class="sub" data-t="lede"></p>

<!-- SIGNAL TRAY -->
<section id="traysec" hidden>
  <div class="sec-head">
    <div class="eyebrow" data-t="eb_tray"></div>
    <h2 data-t="h_tray"></h2>
    <p class="sub" data-t="p_tray"></p>
  </div>
  <div class="traybar">
    <div class="trayfilters" id="trayfilters"></div>
    <div class="tools" style="margin-top:0">
      <button class="btn ghost" id="sigcsv" data-t="btn_sigcsv"></button>
    </div>
  </div>
  <div class="tray" id="tray"></div>
</section>

<!-- PIPELINE -->
<section>
  <div class="sec-head">
    <div class="eyebrow" data-t="eb_pipe"></div>
    <h2 data-t="h_pipe"></h2>
    <p class="sub" data-t="p_pipe"></p>
  </div>
  <div id="exbanner"></div>
  <div class="pipe-bar">
    <div class="pipe-stats" id="pipestats"></div>
    <div class="tools" style="margin-top:0">
      <button class="btn" id="addtoggle" data-t="btn_add"></button>
      <button class="btn ghost" id="oppcsv" data-t="btn_oppcsv"></button>
    </div>
  </div>
  <form class="addform" id="addform" hidden>
    <div class="addgrid">
      <div><label for="f_name" data-t="f_name"></label><input id="f_name" required></div>
      <div><label for="f_hood" data-t="f_hood"></label><select id="f_hood"></select></div>
      <div><label for="f_trade" data-t="f_trade"></label><select id="f_trade"></select></div>
      <div><label for="f_stage" data-t="f_stage"></label><select id="f_stage"></select></div>
      <div><label for="f_val" data-t="f_val"></label><input id="f_val" type="number" min="0" step="1000"></div>
      <div><label for="f_bid" data-t="f_bid"></label><input id="f_bid" type="date"></div>
      <div><label for="f_owner" data-t="f_owner"></label><input id="f_owner"></div>
      <div><label for="f_src" data-t="f_src"></label><select id="f_src"></select></div>
      <div><label for="f_next" data-t="f_next"></label><input id="f_next"></div>
    </div>
    <div class="tools">
      <button class="btn" type="submit" data-t="btn_save"></button>
      <button class="btn ghost" type="button" id="addcancel" data-t="btn_cancel"></button>
    </div>
  </form>
  <div class="board" id="board"></div>
</section>

<!-- CALIBRATION -->
<section>
  <div class="sec-head">
    <div class="eyebrow" data-t="eb_dials"></div>
    <h2 data-t="h_dials"></h2>
    <p class="sub" data-t="p_dials"></p>
  </div>
  <div class="calwrap">
    <div class="dials">
      <div class="dial">
        <label for="d1" data-t="d1"></label>
        <div class="hint" data-t="d1h"></div>
        <input id="d1" type="range" min="60" max="500" step="10" value="200">
        <output id="o1"></output>
      </div>
      <div class="dial">
        <label for="d2" data-t="d2"></label>
        <div class="hint" data-t="d2h"></div>
        <input id="d2" type="range" min="50" max="900" step="25" value="325">
        <output id="o2"></output>
      </div>
      <div class="dial">
        <label for="d3" data-t="d3"></label>
        <div class="hint" data-t="d3h"></div>
        <input id="d3" type="range" min="2" max="40" step="1" value="12">
        <output id="o3"></output>
      </div>
      <div class="dial">
        <label for="d4" data-t="d4"></label>
        <div class="hint" data-t="d4h"></div>
        <input id="d4" type="range" min="3" max="24" step="1" value="9">
        <output id="o4"></output>
      </div>
      <div class="dial">
        <label for="d5" data-t="d5"></label>
        <div class="hint" data-t="d5h"></div>
        <input id="d5" type="range" min="1" max="6" step="1" value="2">
        <output id="o5"></output>
      </div>
    </div>

/* ============ UTIL ============ */
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>(
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function money(n){
  if(!isFinite(n)||n===0) return '$0';
  const a=Math.abs(n);
  if(a>=1e6) return '$'+(n/1e6).toFixed(1)+'M';
  if(a>=1000) return '$'+Math.round(n/1000)+'k';
  return '$'+Math.round(n);
}
const uid = () => 'o'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ============ MODEL ============ */
const DEFAULTS = {perFitout:200, avgTI:325000, winRate:0.12, lead:9, absorb:2};
const dials = {...DEFAULTS};
const HORIZON = 6;

function years(){
  const y0 = new Date().getFullYear();
  return Array.from({length:HORIZON},(_,i)=>y0+i);
}
function nowDecimal(){
  const d=new Date();
  return d.getFullYear() + (d.getMonth()+d.getDate()/30.44)/12;
}
function fitoutsFor(p){
  return (p.units>0 ? p.units/dials.perFitout : 0) + p.seed;
}
function windowFor(p){
  if(!p.done) return null;
  return {open: p.done - dials.lead/12, close: p.done + dials.absorb};
}
function spread(p){
  const w = windowFor(p); if(!w) return {};
  const f = fitoutsFor(p), span = w.close - w.open, out = {};
  if(span<=0) return out;
  years().forEach(y=>{
    const lo=Math.max(w.open,y), hi=Math.min(w.close,y+1);
    if(hi>lo) out[y] = f*(hi-lo)/span;
  });
  return out;
}

/* Aggregate by submarket.
   v1 bug fixed here: units were added for EVERY project including ones whose
   whole bid window falls outside the chart horizon (Ybor Harbor, 2034), while
   their fitouts were not — so Ybor read as 7,586 units producing Gasworx's
   fitouts alone. In-horizon and beyond-horizon units are now separated and
   both are shown. */
function agg(){
  const by = {};
  HOODS.forEach(h => by[h] = {name:h, units:0, unitsBeyond:0, fitouts:0, value:0, won:0, live:0, years:{}});
  P.forEach(p=>{
    const b = by[p.hood];
    const sp = spread(p);
    const inHorizon = Object.keys(sp).length > 0;
    if(inHorizon) b.units += p.units; else b.unitsBeyond += p.units;
    for(const y in sp){
      const f = sp[y];
      b.fitouts += f;
      b.value   += f*dials.avgTI;
      const w = f*dials.avgTI*p.access*dials.winRate;
      b.won += w;
      b.years[y] = (b.years[y]||0) + w;
    }
  });
  // Live pipeline value per submarket, from real rows only.
  rows().forEach(r=>{
    if(r.example) return;
    if(r.stage==='lost') return;
    const b = by[r.hood]; if(!b) return;
    b.live += (r.stage==='won' ? (+r.valueActual||+r.valueEst||0) : (+r.valueEst||0));
  });
  return Object.values(by).filter(b => b.fitouts>0.05 || b.live>0).sort((a,b)=>b.won-a.won);
}

/* ============ PIPELINE STATE ============ */
let DBH = null;                 // db namespace, or null
let OPPS = [];                  // real rows
let usingExamples = true;
const LS_KEY = 'bidradar.v2';

function rows(){ return usingExamples ? EXAMPLES : OPPS; }

function calibration(){
  const real = OPPS.filter(r=>!r.example);
  const won  = real.filter(r=>r.stage==='won');
  const lost = real.filter(r=>r.stage==='lost');
  const wonWithValue = won.filter(r=>+r.valueActual>0);
  const decided = won.length + lost.length;
  return {
    decided,
    won: won.length,
    lost: lost.length,
    winRate: decided ? won.length/decided : null,
    avgTI: wonWithValue.length
      ? wonWithValue.reduce((s,r)=>s+(+r.valueActual),0)/wonWithValue.length
      : null
  };
}

/* ---------- persistence: db when granted, localStorage otherwise ---------- */
function loadLocal(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const s = JSON.parse(raw);
      if(s.dials) Object.assign(dials, s.dials);
      if(Array.isArray(s.opps)) OPPS = s.opps;
      if(s.L) L = s.L;
    }
  }catch(e){}
  usingExamples = OPPS.length === 0;
}
function saveLocal(){
  if(DBH) return;
  try{ localStorage.setItem(LS_KEY, JSON.stringify({dials, opps:OPPS, L})); }catch(e){}
}

async function initStore(){
  let db = null;
  try{ db = await claude.use('db'); }catch(e){ db = null; }
  if(!db) return;                       // localStorage path already live
  DBH = db;
  try{
    db.collection('opportunities').onSnapshot(snap=>{
      OPPS = snap.docs.map(d=>({id:d.id, ...d.data()}));
      usingExamples = OPPS.length === 0;
      renderPipeline(); renderCalib(); renderTable(); renderVintage();
    }, ()=>{ DBH=null; renderVintage(); });
    db.doc('meta/dials').onSnapshot(s=>{
      if(!s.exists) return;
      Object.assign(dials, s.data());
      syncDialInputs(); renderAll();
    }, ()=>{});
    // machine-owned: written by the collector Action via a Claude Routine
    db.collection('signals').onSnapshot(snap=>{
      SIGS = snap.docs.map(d=>({id:d.id, ...d.data()}));
      renderTray();
    }, ()=>{ SIGS=[]; renderTray(); });
  }catch(e){ DBH=null; }
  renderVintage();
}

async function persistDials(){
  if(DBH){ try{ await DBH.doc('meta/dials').set({...dials}); }catch(e){} }
  else saveLocal();
}
async function addOpp(rec){
  if(DBH){
    try{ await DBH.collection('opportunities').add(rec); return; }catch(e){}
  }
  OPPS = OPPS.concat([{id:uid(), ...rec}]);
  usingExamples = false;
  saveLocal(); renderPipeline(); renderCalib(); renderTable(); renderChart();
}
async function patchOpp(id, patch){
  if(DBH){
    try{ await DBH.doc('opportunities/'+id).update(patch); return; }catch(e){}
  }
  OPPS = OPPS.map(r => r.id===id ? {...r, ...patch} : r);
  saveLocal(); renderPipeline(); renderCalib(); renderTable(); renderChart();
}
async function delOpp(id){
  if(DBH){
    try{ await DBH.doc('opportunities/'+id).delete(); return; }catch(e){}
  }
  OPPS = OPPS.filter(r => r.id!==id);
  usingExamples = OPPS.length === 0;
  saveLocal(); renderPipeline(); renderCalib(); renderTable(); renderChart();
}

/* ============ SIGNAL TRAY ============
   signals/ is machine-owned: the collector Action writes it and a Claude
   Routine syncs it here. The page only ever writes the three human-owned
   fields — dismissed, promotedTo, notes — so a re-collection cannot undo a
   decision somebody made.                                                  */
let SIGS = [];
let trayFilter = 'all';

function liveSignals(){
  return SIGS.filter(x => !x.dismissed && !x.promotedTo)
             .filter(x => trayFilter !== 'contact' || (x.contacts||[]).length)
             .filter(x => trayFilter !== 'hot' || (+x.score||0) >= 70)
             .sort((a,b) => (+b.score||0) - (+a.score||0));
}

function contactLink(c){
  const v = esc(c.value);
  if(c.kind === 'phone') return `<a href="tel:${v.replace(/[^0-9+]/g,'')}">${v}</a>`;
  if(c.kind === 'email') return `<a href="mailto:${v}">${v}</a>`;
  return v;
}

function sigCard(x){
  const T_ = t();
  const score = +x.score || 0;
  const tone = score >= 70 ? '' : score >= 60 ? ' mid' : ' low';
  const trade = TRADES.find(y => y.id === x.trade);
  const src   = SOURCES.find(y => y.id === x.source);
  const name  = x.entity || x.scope || x.source_id || '—';
  const win   = x.bid_window || {};
  const contacts = x.contacts || [];
  const size = x.value_est ? money(+x.value_est)
             : x.seats ? `${x.seats} seats`
             : x.sqft ? `${Math.round(x.sqft).toLocaleString()} sf` : '';

  const flags = [];
  if((x.warnings||[]).includes('trade_undeclared')) flags.push(T_.sig_undeclared);
  if((x.warnings||[]).includes('needs_contact') && !contacts.length) flags.push(T_.sig_nocontact);

  return `<article class="sig${tone}" data-sig="${esc(x.id)}">
    <div class="sig-top">
      <div class="nm">${esc(name)}</div>
      <span class="score ${score>=70?'s-hi':score>=60?'s-mid':'s-lo'}">${score}</span>
    </div>
    <div class="addr">${esc(x.address||'')}</div>
    <div class="meta">
      <span>${esc(hoodLabelOf(x))}</span>
      ${trade?`<span>${esc(trade[L])}</span>`:''}

/* Promote writes the opportunity at a deterministic id, so promoting the same
   signal twice updates one row rather than making two. */
async function promoteSignal(sigId, btn){
  const x = SIGS.find(y => y.id === sigId);
  if(!x || !DBH) return;
  btn.disabled = true;
  const oppId = 'sig-' + sigId;
  const rec = {
    name: x.entity || x.scope || x.source_id || 'Untitled',
    hood: hoodLabelOf(x),
    trade: x.trade && x.trade !== 'other' ? x.trade : 'other',
    stage: 'signal',
    valueEst: +x.value_est || 0,
    source: x.source,
    bidDate: (x.bid_window && x.bid_window.open) || x.filed_at || '',
    owner: '',
    nextAction: t().promoted_action,
    address: x.address || '',
    sourceUrl: x.source_url || '',
    contacts: x.contacts || [],
    signalId: sigId,
    score: +x.score || 0,
    createdAt: new Date().toISOString()
  };
  try{
    await DBH.doc('opportunities/' + oppId).set(rec);
    await DBH.doc('signals/' + sigId).update({
      promotedTo: oppId, promotedAt: new Date().toISOString()
    });
  }catch(e){ btn.disabled = false; }
}

async function dismissSignal(sigId, btn){
  if(!DBH) return;
  btn.disabled = true;
  try{
    await DBH.doc('signals/' + sigId).update({
      dismissed: true, dismissedAt: new Date().toISOString()
    });
  }catch(e){ btn.disabled = false; }
}

/* ============ JOBTREAD ============
   Calls the viewer's own Ideal connector (JobTread Pave API) with the
   viewer's credentials. Both query shapes below were run against the live
   org in the session that wrote this page — see PLAN.md §6 Phase 1.        */
const JT_ORG = '22P6bRn5p6Pn';
let MCP = null;
let mcpReady = (async () => { try{ MCP = await claude.use('mcp'); }catch(e){ MCP = null; } })();

function jtMessage(err){
  const T_ = t();
  switch(err && err.code){
    case 'server_not_connected': return T_.jt_unavail;
    case 'needs_reauth':         return T_.jt_reauth;
    case 'blocked_by_policy':
    case 'approval_required':    return T_.jt_denied;
    case 'tool_error':           return T_.jt_failed + (err.message ? ': ' + err.message : '');
    case 'server_unavailable':
    case 'upstream_error':       return T_.jt_retry;
    default:                     return T_.jt_failed;
  }
}

async function jtFindAccount(name){
  const res = await MCP.callTool('Ideal', 'query', {query: {
    organization: {
      $: {id: JT_ORG},
      accounts: {
        $: {where: {and: [['type','customer'], ['name','like','%' + name.slice(0,40) + '%']]}, size: 1},
        nodes: {id: {}, name: {}}
      }
    }
  }});
  const p = res && res.payload;
  const nodes = (p && p.organization && p.organization.accounts && p.organization.accounts.nodes) || [];
  return nodes[0] || null;
}

/* Ideal's own job pipeline, read from the organization's custom field
   22P6bRnsNu2Y (type option, targetType job) on 2026-09-14. These are the
   eleven values that field actually offers — not a guess at a generic
   JobTread vocabulary. */
const JT_STAGE = {
  'New Lead': 'signal',
  'Estimate with Cost $': 'bidding',
  'Estimating HOMEE': 'bidding',
  'Approved': 'won',
  'Subcontractor Agreement': 'won',
  'Permitting': 'won',
  'Construction': 'won',
  'Closed Waiting for payments': 'won',
  'Paid Waiting to split': 'won',
  'Closed Won': 'won',
  'Closed Lost': 'lost'
};

async function jtJobsForAccount(accountId){
  const res = await MCP.callTool('Ideal', 'query', {query: {
    organization: {
      $: {id: JT_ORG},
      jobs: {
        $: {size: 10},
        nodes: {
          id: {}, name: {}, closedOn: {},
          location: {account: {id: {}}},
          documents: {priceSum: {_: 'sum', $: 'price'}},
          customFieldValues: {$: {size: 20},
            nodes: {value: {}, customField: {name: {}}}}
        }
      }
    }
  }});
  const p = res && res.payload;
  const all = (p && p.organization && p.organization.jobs && p.organization.jobs.nodes) || [];
  return all.filter(j => j.location && j.location.account && j.location.account.id === accountId);
}

function jtStatusOf(job){
  const vals = (job.customFieldValues && job.customFieldValues.nodes) || [];
  const f = vals.find(v => v.customField && v.customField.name === 'Status');
  return f ? f.value : null;
}

/* Moves the row's stage to match JobTread. Deliberately does NOT write
   valueActual: documents.priceSum totals estimates, change orders and
   invoices together, and calibration is only worth having if the contract
   value on a Won row is the real one somebody typed. The total is shown as a
   prompt, not written as a fact. */
async function refreshFromJobTread(oppId, btn){
  const T_ = t();
  const r = OPPS.find(x => x.id === oppId);
  if(!r || !r.jobtreadAccountId) return;
  await mcpReady;
  const note = btn.parentElement.querySelector('.jt') || (() => {
    const el = document.createElement('span'); el.className = 'jt';
    btn.parentElement.appendChild(el); return el;
  })();
  if(!MCP){ note.className = 'jt err'; note.textContent = T_.jt_unavail; return; }

  btn.disabled = true; note.className = 'jt'; note.textContent = T_.jt_checking;
  try{
    const jobs = await jtJobsForAccount(r.jobtreadAccountId);
    if(!jobs.length){ note.textContent = T_.jt_nojob; btn.disabled = false; return; }
    const job = jobs[0];
    const status = jtStatusOf(job);
    const stage = status ? JT_STAGE[status] : null;
    if(!stage){ note.textContent = `${T_.jt_status}: ${status || '—'}`; btn.disabled = false; return; }

    const patch = {stage, jobtreadJobId: job.id, jobtreadStatus: status,
                   jobtreadCheckedAt: new Date().toISOString()};
    await patchOpp(oppId, patch);
    const total = job.documents && job.documents.priceSum;
    note.textContent = `${status} → ${stage}` +
      (stage === 'won' && total ? ` · ${T_.jt_docs} ${money(total)}` : '');
  }catch(err){
    note.className = 'jt err';
    note.textContent = jtMessage(err);
    btn.disabled = false;
  }
}

async function jtCreateAccount(name){
  const res = await MCP.callTool('Ideal', 'query', {query: {
    createAccount: {
      $: {organizationId: JT_ORG, name: name.slice(0, 120),
          type: 'customer', suffixIfNecessary: true},
      createdAccount: {id: {}, name: {}}
    }
  }});
  const p = res && res.payload;
  return (p && p.createAccount && p.createAccount.createdAccount) || null;
}

async function sendToJobTread(oppId, btn){
  const T_ = t();
  const r = OPPS.find(x => x.id === oppId);
  if(!r) return;
  await mcpReady;
  const note = btn.parentElement.querySelector('.jt') || (() => {
    const el = document.createElement('span'); el.className = 'jt';
    btn.parentElement.appendChild(el); return el;
  })();

  if(!MCP){ note.className = 'jt err'; note.textContent = T_.jt_unavail; return; }

  btn.disabled = true; note.className = 'jt'; note.textContent = T_.jt_sending;
  try{
    let acct = await jtFindAccount(r.name);
    if(acct){
      note.textContent = T_.jt_exists + ' — ' + acct.name;
    }else{
      if(!confirm(`${T_.jt_send}: ${r.name}?`)){
        btn.disabled = false; note.textContent = ''; return;
      }
      acct = await jtCreateAccount(r.name);
      note.textContent = acct ? T_.jt_sent : T_.jt_failed;
    }
    if(acct && acct.id) await patchOpp(oppId, {jobtreadAccountId: acct.id, jobtreadName: acct.name});
  }catch(err){
    note.className = 'jt err';
    note.textContent = jtMessage(err);
    btn.disabled = false;
  }
}

    }
    return `<article class="proj f${p.fit}">
      <div class="proj-top">
        <h3>${esc(p.name)}</h3>
        <span class="small">${T_.fitlabel[p.fit]}</span>
      </div>
      <div class="proj-meta">${esc(p.hood)} · ${esc(p.cat)} · ${esc(p.dev)}${p.arch!=='—'?' · '+esc(p.arch):''}</div>
      <p class="angle">${esc(L==='en'?p.en:p.pt)}</p>
      <div class="facts">
        ${p.units?`<span><b>${p.units.toLocaleString()}</b> ${T_.u_units}</span>`:''}
        ${p.floors?`<span><b>${p.floors}</b> ${T_.u_fl}</span>`:''}
        <span><b>${p.done||'—'}</b> ${p.done?T_.u_delivery:''}</span>
        <span><b>${fitoutsFor(p).toFixed(1)}</b> ${T_.u_fitouts}</span>
        <span><b>${money(fitoutsFor(p)*dials.avgTI*p.access*dials.winRate)}</b></span>
      </div>
      ${win}
    </article>`;
  }).join('');
}

function renderFilters(){
  const T_ = t();
  document.getElementById('filters').innerHTML =
    [`<button class="chip" data-h="__all" aria-pressed="${filter==='__all'}">${T_.all}</button>`]
    .concat(HOODS.map(h=>`<button class="chip" data-h="${esc(h)}" aria-pressed="${filter===h}">${esc(h)}</button>`))
    .join('');
  document.querySelectorAll('#filters .chip').forEach(b=>{
    b.onclick = () => { filter = b.dataset.h; renderFilters(); renderProjects(); };
  });
}

/* ============ RENDER: form + text ============ */
function renderForm(){
  const T_ = t();
  const opts = (arr, val) => arr.map(o=>`<option value="${o.id}"${o.id===val?' selected':''}>${o[L]}</option>`).join('');
  document.getElementById('f_hood').innerHTML  = HOODS.map(h=>`<option value="${esc(h)}">${esc(h)}</option>`).join('');
  document.getElementById('f_trade').innerHTML = opts(TRADES,'retail');
  document.getElementById('f_stage').innerHTML = opts(STAGES,'signal');
  document.getElementById('f_src').innerHTML   = opts(SOURCES,'manual');
}

function syncDialInputs(){
  d1.value = dials.perFitout;
  d2.value = Math.round(dials.avgTI/1000);
  d3.value = Math.round(dials.winRate*100);
  d4.value = dials.lead;
  d5.value = dials.absorb;
}

function renderText(){
  const T_ = t();
  document.querySelectorAll('[data-t]').forEach(el=>{
    if(T_[el.dataset.t] != null) el.textContent = T_[el.dataset.t];
  });
  document.documentElement.lang = L==='en' ? 'en' : 'pt-BR';
  document.getElementById('o1').textContent = dials.perFitout + ' ' + T_.u_units;
  document.getElementById('o2').textContent = '$' + Math.round(dials.avgTI/1000) + 'k';
  document.getElementById('o3').textContent = Math.round(dials.winRate*100) + '%';
  document.getElementById('o4').textContent = dials.lead + ' ' + T_.mo;
  document.getElementById('o5').textContent = dials.absorb + (L==='en' ? ' yr' : ' anos');
}

function renderAll(){
  renderText(); renderVintage(); renderTray(); renderPipeline(); renderCalib();
  renderChart(); renderTable(); renderSignals(); renderFilters(); renderProjects();
}

/* ============ EVENTS ============ */
document.getElementById('en').onclick = () => { L='en'; setLang(); };
document.getElementById('pt').onclick = () => { L='pt'; setLang(); };
function setLang(){
  document.getElementById('en').setAttribute('aria-pressed', L==='en');
  document.getElementById('pt').setAttribute('aria-pressed', L==='pt');
  renderForm(); renderAll(); saveLocal();
}

const bind = (id, fn) => document.getElementById(id).addEventListener('input', e=>{
  fn(+e.target.value); renderAll(); persistDials();
});
bind('d1', v => dials.perFitout = v);
bind('d2', v => dials.avgTI = v*1000);
bind('d3', v => dials.winRate = v/100);
bind('d4', v => dials.lead = v);
bind('d5', v => dials.absorb = v);

document.getElementById('reset').onclick = () => {
  Object.assign(dials, DEFAULTS);
  syncDialInputs(); renderAll(); persistDials();
};
document.getElementById('applyactual').onclick = () => {
  const c = calibration();
  if(c.winRate != null) dials.winRate = Math.min(0.40, Math.max(0.02, c.winRate));
  if(c.avgTI   != null) dials.avgTI   = Math.min(900000, Math.max(50000, Math.round(c.avgTI/1000)*1000));
  syncDialInputs(); renderAll(); persistDials();
};

// sortable submarket headers (v1 declared the state but never bound the click)
document.querySelectorAll('#subtable th[data-sort]').forEach(th=>{
  th.onclick = () => {
    const k = th.dataset.sort;
    if(sortKey===k) sortDir = -sortDir; else { sortKey = k; sortDir = (k==='name'?1:-1); }
    renderTable();
  };
});

// add form
const form = document.getElementById('addform');
document.getElementById('addtoggle').onclick = () => {
  form.hidden = !form.hidden;
  if(!form.hidden) document.getElementById('f_name').focus();
};
document.getElementById('addcancel').onclick = () => { form.hidden = true; };
form.onsubmit = e => {
  e.preventDefault();
  const name = document.getElementById('f_name').value.trim();
  if(!name) return;
  addOpp({
    name,
    hood:       document.getElementById('f_hood').value,
    trade:      document.getElementById('f_trade').value,
    stage:      document.getElementById('f_stage').value,
    valueEst:   +document.getElementById('f_val').value || 0,
    valueActual:0,
    bidDate:    document.getElementById('f_bid').value || '',
    owner:      document.getElementById('f_owner').value.trim() || '—',
    source:     document.getElementById('f_src').value,
    nextAction: document.getElementById('f_next').value.trim() || '',
    createdAt:  new Date().toISOString()
  });
  form.reset(); renderForm(); form.hidden = true;
};

/* exports — the artifact viewer blocks script-started downloads, so use the
   downloads capability there and fall back to an anchor in a plain browser. */
let DL = null;
(async () => { try{ DL = await claude.use('downloads'); }catch(e){ DL = null; } })();

async function download(name, text){
  if(DL){
    try{ await DL.save({filename:name, data:text}); return; }catch(e){}
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type:'text/csv'}));
  a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
const csvCell = v => `"${String(v==null?'':v).replace(/"/g,'""')}"`;

document.getElementById('csv').onclick = () => {
  const rowsA = agg(), YRS = years();
  const head = ['Submarket','UnitsInHorizon','UnitsBeyondHorizon','Fitouts','BiddableUSD','OurShareUSD','LivePipelineUSD']
                 .concat(YRS).join(',');
  const body = rowsA.map(r =>
    [r.name, r.units, r.unitsBeyond, r.fitouts.toFixed(2), Math.round(r.value),
     Math.round(r.won), Math.round(r.live)]
      .concat(YRS.map(y=>Math.round(r.years[y]||0)))
      .map(csvCell).join(',')).join('\n');
  download('tampa-submarkets.csv', head+'\n'+body);
};

document.getElementById('oppcsv').onclick = () => {
  const head = 'Name,Submarket,Type,Stage,Source,EstValueUSD,ActualValueUSD,BidDate,Owner,NextAction,Example';
  const body = rows().map(r =>
    [r.name, r.hood, r.trade, r.stage, r.source, r.valueEst||0, r.valueActual||0,
     r.bidDate||'', r.owner||'', r.nextAction||'', r.example?'YES':'']
      .map(csvCell).join(',')).join('\n');
  download('tampa-pipeline.csv', head+'\n'+body);
};

document.getElementById('sigcsv').onclick = () => {
  const head = 'Score,Source,Ref,Stage,Submarket,Trade,Entity,Address,Phone,Email,'+
               'Filed,WindowOpen,WindowClose,ValueUSD,SqFt,Flags,SourceURL';
  const body = liveSignals().map(x => {
    const c = x.contacts || [], w = x.bid_window || {};
    return [x.score||0, x.source, x.source_id||'', x.stage_hint||'', hoodLabelOf(x),
            x.trade||'', x.entity||x.scope||'', x.address||'',
            (c.find(y=>y.kind==='phone')||{}).value||'',
            (c.find(y=>y.kind==='email')||{}).value||'',
            x.filed_at||'', w.open||'', w.close||'', x.value_est||'', x.sqft||'',
            (x.warnings||[]).join(' '), x.source_url||'']
           .map(csvCell).join(',');
  }).join('\n');
  download('tampa-signals.csv', head+'\n'+body);
};

/* ============ BOOT ============ */
loadLocal();
syncDialInputs();
renderForm();
setLang();
initStore();   // upgrades to shared db if this view grants it
</script>
