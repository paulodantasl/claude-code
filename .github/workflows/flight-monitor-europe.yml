name: Flight Price Monitor — Europe Deals

on:
  schedule:
    # Once daily ~9am Eastern (14:00 UTC)
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: flight-monitor-europe
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r flight_monitor/requirements.txt

      - uses: actions/cache@v4
        with:
          path: flight_monitor/data/prices.db
          key: flight-prices-${{ github.run_id }}
          restore-keys: flight-prices-

      - name: Run Europe deal monitor
        run: |
          cd flight_monitor
          python monitor.py --monitor europe --json > ../monitor_europe.json
          python monitor.py --monitor europe > ../monitor_europe.txt
        env:
          IGNAV_API_KEY: ${{ secrets.IGNAV_API_KEY }}

      - name: Check alert
        id: alert
        run: |
          echo "triggered=$(python3 -c "import json; print('true' if json.load(open('monitor_europe.json')).get('alert_triggered') else 'false')")" >> "$GITHUB_OUTPUT"

      - run: cat monitor_europe.txt >> $GITHUB_STEP_SUMMARY

      - name: Open issue on deal alert
        if: steps.alert.outputs.triggered == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 flight_monitor/scripts/create_alert_issue.py monitor_europe.json
