name: Season Flight Search (Sep–Feb)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r flight_monitor/requirements.txt

      - name: Run season sweep
        run: python flight_monitor/scripts/season_sweep_search.py | tee season_sweep_report.txt
        env:
          IGNAV_API_KEY: ${{ secrets.IGNAV_API_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: season-sweep-search
          path: |
            season_sweep_report.txt
            season_sweep_results.json

      - run: cat season_sweep_report.txt >> $GITHUB_STEP_SUMMARY
