name: Jan Week 2 Flight Search

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r flight_monitor/requirements.txt

      - name: Run Jan week-2 search
        run: python flight_monitor/scripts/jan_week2_search.py | tee jan_week2_report.txt
        env:
          IGNAV_API_KEY: ${{ secrets.IGNAV_API_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: jan-week2-search
          path: |
            jan_week2_report.txt
            jan_week2_results.json

      - run: cat jan_week2_report.txt >> $GITHUB_STEP_SUMMARY
