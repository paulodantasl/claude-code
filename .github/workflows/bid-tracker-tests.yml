name: Bid Tracker Tests

on:
  pull_request:
    paths:
      - "bid_tracker/**"
      - ".github/workflows/bid-tracker-tests.yml"
  push:
    branches: [main]
    paths:
      - "bid_tracker/**"
      - ".github/workflows/bid-tracker-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r bid_tracker/requirements-dev.txt
      # Fixtures only. No data, no cache, no artifacts: this repo is public.
      - run: python -m pytest bid_tracker/tests -m "not integration" -q
