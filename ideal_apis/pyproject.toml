[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ideal-apis"
version = "0.1.0"
description = "Unified client for Ideal Construction Tier 1 & 2 public APIs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.26.0",
  "click>=8.1.7",
  "python-dotenv>=1.0.0",
  "tenacity>=8.2.0",
  "pydantic>=2.5.0",
  "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-httpx>=0.30.0"]

[project.scripts]
ideal-api = "ideal_apis.cli:main"
ideal-leads = "ideal_apis.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ideal_apis*"]
